server {
    listen 7365 default_server;
    listen [::]:7365 default_server;
    server_name ollama-ui;
    root /usr/share/nginx/html;
    charset UTF-8;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
